project:
  type: website
  output-dir: docs
  resources:
    - rss.xsl
  post-render: add-rss-style.ts

website:
  title: "ChartifyR"
  site-url: https://noahweidig.github.io/chartifyr
  favicon: "chartifyr-logo.svg"
  margin-header: subscribe.html
  search:
    location: navbar
    type: textbox
  navbar:
    logo: "chartifyr-logo.svg"
    title: "ChartifyR"
    pinned: true
    collapse-below: lg
    right:
      - text: About
        href: about.qmd
      - text: GitHub
        icon: github
        href: https://github.com/noahweidig/
        aria-label: GitHub
      - text: LinkedIn
        icon: linkedin
        href: https://linkedin.com/in/noahweidig/
        aria-label: LinkedIn
      - text: RSS
        icon: rss
        href: index.xml
        aria-label: RSS Feed
  back-to-top-navigation: true
  repo-url: https://github.com/noahweidig/chartifyr
  repo-actions: [source, issue]
  open-graph: true
  twitter-card: true
  page-footer:
    border: false
    left: |
      **ChartifyR**<br>
      R, data viz, and ecological storytelling.<br>
      <span class="footer-copy">&copy; 2026 Noah Weidig</span>
    center: |
      [Home](index.qmd) &middot; [About](about.qmd) &middot; [RSS](index.xml)
    right: |
      <a href="https://github.com/noahweidig/" aria-label="GitHub"><i class="bi bi-github"></i></a> <a href="https://linkedin.com/in/noahweidig/" aria-label="LinkedIn"><i class="bi bi-linkedin"></i></a> <a href="index.xml" aria-label="RSS"><i class="bi bi-rss-fill"></i></a><br>
      <span class="footer-copy">Built with [Quarto](https://quarto.org/)</span>

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    mainfont: "Inter"
    monofont: "JetBrains Mono"
    fontsize: 1.02rem
    toc: true
    toc-depth: 3
    toc-title: "On this page"
    anchor-sections: true
    lightbox: true
    fig-align: center
    fig-responsive: true
    code-line-numbers: false
    include-in-header:
      - text: |
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    css: styles.css
    smooth-scroll: true
    link-external-newwindow: true
    code-copy: true
    code-overflow: wrap
    highlight-style: github
    include-after-body: _navbar-search.html

editor: visual
