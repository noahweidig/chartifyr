# options specified here will apply to all posts in this folder

# freeze computational output
# (see https://quarto.org/docs/projects/code-execution.html#freeze)
freeze: true

# Enable banner style title blocks
title-block-banner: true

# Code defaults
code-tools: true

# Share buttons (schochastics/quarto-social-share); each post sets share.permalink
filters:
  - social-share
share:
  twitter: true
  linkedin: true
  bsky: true
  mastodon: true
  reddit: true
  facebook: true
  email: true
